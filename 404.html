<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FORMULA3 has moved</title>
  <meta name="robots" content="noindex">
  <script>
    // Old links looked like /website/<path>; send them to /<path> on the new address.
    var path = location.pathname.replace(/^\/website(?=\/|$)/, "") || "/";
    location.replace("https://vines-formula3.github.io" + path + location.search + location.hash);
  </script>
</head>
<body>
  <p>The FORMULA3 website has moved to <a href="https://vines-formula3.github.io/">vines-formula3.github.io</a>.</p>
</body>
</html>
